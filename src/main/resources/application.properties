spring.application.name=nexoerp
spring.main.allow-bean-definition-overriding=true

# Forzamos puerto fijo para evitar conflicto con PORT
server.port=8082
server.address=0.0.0.0

# =================================================================
# Base de datos por defecto: H2 en archivo (solo desarrollo local)
# Produccion: --spring.profiles.active=postgres  o  oracle
# =================================================================
# Base de datos H2 en memoria para desarrollo (evita problemas de archivo bloqueado).
# En producción se usa el perfil postgres u oracle.
spring.datasource.url=jdbc:h2:mem:nexoerp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Forzamos el dialecto H2 para que no dependa de metadata JDBC.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=false

# HikariCP - Pool optimizado
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=NexoERP-Pool
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.validation-timeout=3000

# Zona horaria
spring.jackson.time-zone=America/Lima

# Compresion HTTP (respuestas mas ligeras)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Sesion
server.servlet.session.timeout=30m

# Pagina de error limpia (no mostrar trazas)
server.error.include-stacktrace=never
server.error.include-message=never

# Encoding
spring.thymeleaf.encoding=UTF-8
spring.web.encoding.charset=UTF-8
spring.web.encoding.force=true

# Logs
logging.file.name=logs/nexoerp.log
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.farmacia.sistema=INFO
logging.level.org.springframework.security=WARN

# JWT - En produccion sobreescribir con variable de entorno APP_SECURITY_JWT_SECRET
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:ZmFybWFjaWEtc2lzdGVtYS1zZWNyZXRvLWxhcmdvLWxhcmdvLWxhcmdvLWxhcmdv}
app.security.jwt.expiration-ms=${APP_SECURITY_JWT_EXPIRATION:3600000}

# Actuator - Monitoreo y métricas
management.endpoints.web.exposure.include=health,info,prometheus,metrics,caches,env
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN,SAAS_ADMIN
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true
management.endpoint.caches.enabled=true
info.app.name=NexoERP
info.app.version=1.0.0
info.app.description=Sistema de gestion farmaceutica multi-tenant

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.sunatApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.sunatApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sunatApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.sunatApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.sunatApi.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.sunatApi.slow-call-rate-threshold=80

resilience4j.circuitbreaker.instances.mailService.sliding-window-size=5
resilience4j.circuitbreaker.instances.mailService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mailService.wait-duration-in-open-state=60s

resilience4j.retry.instances.sunatApi.max-attempts=3
resilience4j.retry.instances.sunatApi.wait-duration=2s
resilience4j.retry.instances.mailService.max-attempts=2
resilience4j.retry.instances.mailService.wait-duration=5s

# Rate Limiter para APIs públicas
resilience4j.ratelimiter.instances.apiPublica.limit-for-period=100
resilience4j.ratelimiter.instances.apiPublica.limit-refresh-period=1m
resilience4j.ratelimiter.instances.apiPublica.timeout-duration=0s

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Perfil por defecto
spring.profiles.default=dev

