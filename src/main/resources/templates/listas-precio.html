<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Listas de Precios - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout">    <div th:replace="~{fragments/sidebar :: sidebar('listas-precio')}"></div>
<div class="main-wrapper"><header class="topbar"><h1 class="topbar-title">Listas de Precios</h1></header>
<main class="main-content">
<div th:if="${ok}" class="alert alert-success"><span th:text="${ok}"></span></div>
<div class="content-card mb-3"><div class="content-card-header"><h5>Nueva lista de precios</h5></div><div class="content-card-body">
<form method="post" th:action="@{/web/listas-precio}"><div class="row g-2">
<div class="col-md-3"><input type="text" name="nombre" class="form-control form-control-sm" placeholder="Nombre" required></div>
<div class="col-md-2"><select name="tipoCliente" class="form-select form-select-sm"><option value="">Tipo cliente</option><option th:each="t : ${tiposCliente}" th:value="${t}" th:text="${t}">-</option></select></div>
<div class="col-md-2"><input type="number" name="descuento" step="0.1" class="form-control form-control-sm" placeholder="Desc. %"></div>
<div class="col-md-2"><input type="date" name="fechaInicio" class="form-control form-control-sm"></div>
<div class="col-md-2"><input type="date" name="fechaFin" class="form-control form-control-sm"></div>
<div class="col-md-1"><button class="btn btn-primary btn-sm w-100"><i class="bi bi-plus"></i></button></div>
</div></form></div></div>
<div class="content-card"><div class="content-card-body table-responsive">
<table class="table table-sm" style="font-size:12px;"><thead><tr><th>Nombre</th><th>Tipo cliente</th><th>Desc. %</th><th>Inicio</th><th>Fin</th><th>Activo</th><th></th></tr></thead><tbody>
<tr th:each="l : ${listas}">
<td th:text="${l.nombre}">-</td><td th:text="${l.tipoCliente}">-</td><td th:text="${l.descuentoPorcentaje != null ? l.descuentoPorcentaje + '%' : '-'}">-</td>
<td th:text="${l.fechaInicio}">-</td><td th:text="${l.fechaFin}">-</td>
<td><span th:if="${l.activo}" class="badge bg-success">S&iacute;</span><span th:unless="${l.activo}" class="badge bg-secondary">No</span></td>
<td><a th:href="@{/web/listas-precio/{id}(id=${l.id})}" class="btn btn-xs btn-outline-primary"><i class="bi bi-eye"></i></a>
<form th:action="@{/web/listas-precio/{id}/toggle(id=${l.id})}" method="post" class="d-inline"><button class="btn btn-xs btn-outline-warning" th:text="${l.activo ? 'Desact.' : 'Act.'}">-</button></form></td>
</tr></tbody></table></div></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
