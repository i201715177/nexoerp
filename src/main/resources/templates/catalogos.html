<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cat&aacute;logos - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout">    <div th:replace="~{fragments/sidebar :: sidebar('catalogos')}"></div>
<div class="main-wrapper"><header class="topbar"><h1 class="topbar-title">Cat&aacute;logos Maestros</h1></header>
<main class="main-content">
<div th:if="${ok}" class="alert alert-success"><span th:text="${ok}"></span></div>
<div class="row g-3">
<!-- Categorías -->
<div class="col-md-4"><div class="content-card"><div class="content-card-header"><h6>Categor&iacute;as</h6></div><div class="content-card-body">
<form method="post" th:action="@{/web/catalogos/categorias}" class="mb-2"><div class="input-group input-group-sm"><input type="text" name="nombre" class="form-control" placeholder="Nueva categor&iacute;a" required><button class="btn btn-primary"><i class="bi bi-plus"></i></button></div></form>
<ul class="list-group list-group-flush" style="font-size:12px;">
<li th:each="c : ${categorias}" class="list-group-item d-flex justify-content-between align-items-center py-1">
<span th:text="${c.nombre}" th:classappend="${!c.activo ? 'text-muted text-decoration-line-through' : ''}">-</span>
<form th:action="@{/web/catalogos/categorias/{id}/toggle(id=${c.id})}" method="post"><button class="btn btn-xs btn-outline-secondary" th:text="${c.activo ? 'Desact.' : 'Act.'}">-</button></form>
</li></ul></div></div></div>
<!-- Laboratorios -->
<div class="col-md-4"><div class="content-card"><div class="content-card-header"><h6>Laboratorios</h6></div><div class="content-card-body">
<form method="post" th:action="@{/web/catalogos/laboratorios}" class="mb-2"><div class="input-group input-group-sm"><input type="text" name="nombre" class="form-control" placeholder="Nuevo laboratorio" required><input type="text" name="pais" class="form-control" placeholder="Pa&iacute;s" style="width:80px"><button class="btn btn-primary"><i class="bi bi-plus"></i></button></div></form>
<ul class="list-group list-group-flush" style="font-size:12px;">
<li th:each="l : ${laboratorios}" class="list-group-item d-flex justify-content-between py-1">
<span><span th:text="${l.nombre}" th:classappend="${!l.activo ? 'text-muted text-decoration-line-through' : ''}">-</span> <small class="text-muted" th:text="${l.pais}"></small></span>
<form th:action="@{/web/catalogos/laboratorios/{id}/toggle(id=${l.id})}" method="post"><button class="btn btn-xs btn-outline-secondary" th:text="${l.activo ? 'Desact.' : 'Act.'}">-</button></form>
</li></ul></div></div></div>
<!-- Presentaciones -->
<div class="col-md-4"><div class="content-card"><div class="content-card-header"><h6>Presentaciones</h6></div><div class="content-card-body">
<form method="post" th:action="@{/web/catalogos/presentaciones}" class="mb-2"><div class="input-group input-group-sm"><input type="text" name="nombre" class="form-control" placeholder="Nueva presentaci&oacute;n" required><button class="btn btn-primary"><i class="bi bi-plus"></i></button></div></form>
<ul class="list-group list-group-flush" style="font-size:12px;">
<li th:each="p : ${presentaciones}" class="list-group-item d-flex justify-content-between py-1">
<span th:text="${p.nombre}" th:classappend="${!p.activo ? 'text-muted text-decoration-line-through' : ''}">-</span>
<form th:action="@{/web/catalogos/presentaciones/{id}/toggle(id=${p.id})}" method="post"><button class="btn btn-xs btn-outline-secondary" th:text="${p.activo ? 'Desact.' : 'Act.'}">-</button></form>
</li></ul></div></div></div>
</div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
