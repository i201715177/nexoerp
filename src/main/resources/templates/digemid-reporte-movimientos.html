<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloReporte != null ? tituloReporte : 'Reporte movimientos controlados'}" >Reporte movimientos controlados - NexoERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('digemid')}"></div>
    <div class="main-wrapper">
        <header class="topbar">
            <h1 class="topbar-title" th:text="${tituloReporte != null ? tituloReporte : 'Reporte regulatorio - Movimientos controlados'}">Reporte regulatorio - Movimientos controlados</h1>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/digemid}">Volver</a>
        </header>
        <main class="main-content">
            <form method="get" class="row g-2 align-items-end mb-3">
                <div class="col-auto"><label class="form-label">Desde</label><input type="date" name="desde" class="form-control form-control-sm" th:value="${#temporals.format(desde, 'yyyy-MM-dd')}"></div>
                <div class="col-auto"><label class="form-label">Hasta</label><input type="date" name="hasta" class="form-control form-control-sm" th:value="${#temporals.format(hasta, 'yyyy-MM-dd')}"></div>
                <div class="col-auto"><button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-funnel me-1"></i> Filtrar</button></div>
            </form>
            <p class="text-muted">Mostrando desde <strong th:text="${#temporals.format(desde)}">-</strong> hasta <strong th:text="${#temporals.format(hasta)}">-</strong></p>
            <div class="content-card">
                <div class="content-card-body table-responsive">
                    <table class="table table-sm">
                        <thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Lote</th><th>Documento</th><th>Cantidad</th><th>Saldo</th><th>Usuario</th><th>Referencia</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(movimientos)}"><td colspan="9" class="text-muted">Sin movimientos en el periodo.</td></tr>
                        <tr th:each="m : ${movimientos}">
                            <td th:text="${m.fecha != null ? #temporals.format(m.fecha) : '-'}">-</td>
                            <td th:text="${m.producto != null ? m.producto.nombre : '-'}">-</td>
                            <td th:text="${m.tipo}">-</td>
                            <td th:text="${m.lote != null ? m.lote : '-'}">-</td>
                            <td th:text="${m.numeroDocumento != null ? m.numeroDocumento : '-'}">-</td>
                            <td th:text="${m.cantidad}">0</td>
                            <td th:text="${m.saldoDespues}">-</td>
                            <td th:text="${m.usuarioRegistro != null ? m.usuarioRegistro : '-'}">-</td>
                            <td th:text="${m.referencia != null ? m.referencia : '-'}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
