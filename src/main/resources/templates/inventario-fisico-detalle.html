<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inventario F&iacute;sico Detalle - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout"><div class="main-wrapper"><header class="topbar">
<a href="/web/inventario-fisico" class="btn btn-sm btn-outline-secondary me-2">Volver</a>
<h1 class="topbar-title">Inventario <span th:text="${inventario.codigo}">-</span> - <span class="badge" th:classappend="${inventario.estado == 'ABIERTO' ? 'bg-primary' : inventario.estado == 'CERRADO' ? 'bg-warning' : 'bg-success'}" th:text="${inventario.estado}">-</span></h1>
<div class="topbar-actions">
<form th:if="${inventario.estado == 'ABIERTO'}" th:action="@{/web/inventario-fisico/{id}/cerrar(id=${inventario.id})}" method="post" class="d-inline"><button type="submit" class="btn btn-warning btn-sm" onclick="return confirm('Cerrar inventario?')">Cerrar inventario</button></form>
<form th:if="${inventario.estado == 'CERRADO'}" th:action="@{/web/inventario-fisico/{id}/ajustar(id=${inventario.id})}" method="post" class="d-inline"><button type="submit" class="btn btn-success btn-sm" onclick="return confirm('Aplicar todos los ajustes al sistema?')">Aplicar ajustes</button></form>
</div></header>
<main class="main-content">
<div th:if="${ok}" class="alert alert-success"><span th:text="${ok}"></span></div>
<div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
<form th:if="${inventario.estado == 'ABIERTO' or inventario.estado == 'EN_PROCESO'}" method="post" th:action="@{/web/inventario-fisico/{id}/conteo(id=${inventario.id})}">
<div class="content-card"><div class="content-card-body table-responsive">
<table class="table table-sm" style="font-size:12px;"><thead><tr><th>Producto</th><th>C&oacute;digo</th><th>Stock sistema</th><th>Stock f&iacute;sico</th><th>Diferencia</th><th>Observaci&oacute;n</th></tr></thead><tbody>
<tr th:each="d : ${detalles}">
<input type="hidden" name="detalleIds" th:value="${d.id}">
<td th:text="${d.producto.nombre}">-</td><td th:text="${d.producto.codigo}">-</td>
<td th:text="${d.stockSistema}">0</td>
<td><input type="number" name="stocksFisicos" class="form-control form-control-sm" style="width:80px" th:value="${d.stockFisico}" min="0"></td>
<td th:classappend="${d.diferencia != null and d.diferencia != 0 ? (d.diferencia > 0 ? 'text-success' : 'text-danger') : ''}" th:text="${d.diferencia != null ? d.diferencia : '-'}">-</td>
<td><input type="text" name="observaciones" class="form-control form-control-sm" th:value="${d.observacion}" style="width:200px"></td>
</tr></tbody></table>
<button type="submit" class="btn btn-primary btn-sm mt-2"><i class="bi bi-save"></i> Guardar conteos</button>
</div></div></form>
<div th:if="${inventario.estado == 'CERRADO' or inventario.estado == 'AJUSTADO'}" class="content-card"><div class="content-card-body table-responsive">
<table class="table table-sm" style="font-size:12px;"><thead><tr><th>Producto</th><th>Stock sistema</th><th>Stock f&iacute;sico</th><th>Diferencia</th><th>Ajustado</th><th>Obs.</th></tr></thead><tbody>
<tr th:each="d : ${detalles}" th:classappend="${d.diferencia != null and d.diferencia != 0 ? 'table-warning' : ''}">
<td th:text="${d.producto.nombre}">-</td><td th:text="${d.stockSistema}">0</td><td th:text="${d.stockFisico != null ? d.stockFisico : '-'}">-</td>
<td class="fw-bold" th:classappend="${d.diferencia != null and d.diferencia > 0 ? 'text-success' : d.diferencia != null and d.diferencia < 0 ? 'text-danger' : ''}" th:text="${d.diferencia != null ? d.diferencia : '-'}">-</td>
<td><span th:if="${d.ajustado}" class="badge bg-success">S&iacute;</span><span th:unless="${d.ajustado}" class="text-muted">No</span></td>
<td th:text="${d.observacion}">-</td>
</tr></tbody></table></div></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
