<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auditor&iacute;a - NexoERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('auditoria')}"></div>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- Main -->
    <div class="main-wrapper">
        <header class="topbar">
            <button class="btn-sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <h1 class="topbar-title">Auditor&iacute;a de acciones</h1>
            <div class="topbar-actions"></div>
            <div class="topbar-user" th:if="${usuarioActual != null}">
                <div class="topbar-user-avatar" th:text="${#strings.toUpperCase(#strings.substring(usuarioActual,0,1))}">A</div>
                <div>
                    <span class="topbar-user-name" th:text="${usuarioActual}">admin</span>
                    <div class="topbar-user-empresa" th:text="${empresaActual != null ? empresaActual.nombre : ''}"></div>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout-top"><i class="bi bi-box-arrow-left"></i> Salir</button>
                </form>
            </div>
        </header>

        <main class="main-content">
            <!-- KPIs -->
            <div class="kpi-row"
                 th:with="total=${registros != null ? #lists.size(registros) : 0},
                          creaciones=${registros != null ? #lists.size(registros.?[metodo == 'POST']) : 0},
                          actualizaciones=${registros != null ? #lists.size(registros.?[metodo == 'PUT']) : 0},
                          eliminaciones=${registros != null ? #lists.size(registros.?[metodo == 'DELETE']) : 0}">
                <div class="kpi-card">
                    <div class="kpi-icon blue"><i class="bi bi-shield-check"></i></div>
                    <div class="kpi-body">
                        <div class="kpi-label">Total registros</div>
                        <div class="kpi-value" th:text="${total}">0</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon green"><i class="bi bi-plus-circle"></i></div>
                    <div class="kpi-body">
                        <div class="kpi-label">Creaciones</div>
                        <div class="kpi-value" th:text="${creaciones}">0</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon yellow"><i class="bi bi-pencil-square"></i></div>
                    <div class="kpi-body">
                        <div class="kpi-label">Actualizaciones</div>
                        <div class="kpi-value" th:text="${actualizaciones}">0</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon red"><i class="bi bi-trash"></i></div>
                    <div class="kpi-body">
                        <div class="kpi-label">Eliminaciones</div>
                        <div class="kpi-value" th:text="${eliminaciones}">0</div>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="content-card">
                <div class="content-card-header">
                    <h3><i class="bi bi-table me-2"></i>&Uacute;ltimas 100 acciones</h3>
                </div>
                <div class="content-card-body no-padding" style="overflow-x:auto;">
                    <div class="export-bar">
                        <a target="_blank" th:href="@{/web/auditoria/excel}" class="btn-export btn-export-excel"><i class="bi bi-file-earmark-excel"></i> Excel</a>
                        <a target="_blank" th:href="@{/web/auditoria/pdf}" class="btn-export btn-export-pdf"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
                    </div>
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Fecha/Hora</th>
                            <th>Usuario</th>
                            <th>Tipo</th>
                            <th>Acci&oacute;n</th>
                            <th>Detalle</th>
                            <th>IP</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${registros}">
                            <td th:text="${#temporals.format(r.fechaHora, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026</td>
                            <td class="fw-700" th:text="${r.usuario}">admin</td>
                            <td>
                                <span class="badge-status"
                                      th:classappend="${r.metodo == 'POST' ? 'active' : (r.metodo == 'DELETE' ? 'danger' : 'warning')}"
                                      th:text="${r.metodo == 'POST' ? 'Crear' : (r.metodo == 'DELETE' ? 'Eliminar' : 'Actualizar')}">Crear</span>
                            </td>
                            <td class="fw-700" th:text="${r.accion}">Crear producto</td>
                            <td th:text="${r.detalle}">Paracetamol 500mg</td>
                            <td th:text="${r.ip}">127.0.0.1</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(registros)}">
                            <td colspan="6">
                                <div class="empty-state">
                                    <i class="bi bi-inbox"></i>
                                    <p>A&uacute;n no hay acciones registradas.</p>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
