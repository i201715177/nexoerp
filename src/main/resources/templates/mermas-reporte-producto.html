<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reporte mermas por producto - NexoERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('mermas')}"></div>
    <div class="main-wrapper">
        <header class="topbar">
            <h1 class="topbar-title">Reporte de mermas por producto</h1>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/mermas}">Volver</a>
        </header>
        <main class="main-content">
            <div class="content-card">
                <div class="content-card-body table-responsive">
                    <table class="table table-sm table-hover">
                        <thead><tr><th>Producto</th><th>C&oacute;digo</th><th>Total registros</th><th>Total unidades perdidas</th><th>Costo total estimado</th><th>% P&eacute;rdida</th><th></th></tr></thead>
                        <tbody>
                        <tr th:if="${reporte == null or #lists.isEmpty(reporte)}"><td colspan="7" class="text-muted">Sin datos.</td></tr>
                        <tr th:each="r : ${reporte}">
                            <td th:text="${r.get('producto').nombre}">-</td>
                            <td th:text="${r.get('producto').codigo}">-</td>
                            <td th:text="${r.get('totalMermas')}">0</td>
                            <td th:text="${r.get('totalCantidad')}">0</td>
                            <td th:text="${r.get('costoTotal')}">0</td>
                            <td><span class="badge" th:classappend="${r.get('porcentajePerdida').doubleValue() > 10} ? 'bg-danger' : 'bg-secondary'" th:text="${r.get('porcentajePerdida') + '%'}">0%</span></td>
                            <td><a th:href="@{/web/mermas/producto/{id}(id=${r.get('producto').id})}" class="btn btn-sm btn-outline-secondary">Detalle</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
