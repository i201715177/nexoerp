<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lista Precio Detalle - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout"><div class="main-wrapper"><header class="topbar"><a href="/web/listas-precio" class="btn btn-sm btn-outline-secondary me-2">Volver</a><h1 class="topbar-title" th:text="'Lista: ' + ${lista.nombre}">-</h1></header>
<main class="main-content">
<div th:if="${ok}" class="alert alert-success"><span th:text="${ok}"></span></div>
<div class="content-card mb-3"><div class="content-card-header"><h6>Agregar producto a la lista</h6></div><div class="content-card-body">
<form method="post" th:action="@{/web/listas-precio/{id}/producto(id=${lista.id})}"><div class="row g-2">
<div class="col-md-4"><select name="productoId" class="form-select form-select-sm" required><option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre + ' (S/' + p.precioVenta + ')'}">-</option></select></div>
<div class="col-md-2"><input type="number" name="precioEspecial" step="0.01" class="form-control form-control-sm" placeholder="Precio esp."></div>
<div class="col-md-2"><input type="number" name="descuentoPct" step="0.1" class="form-control form-control-sm" placeholder="Desc %"></div>
<div class="col-md-2"><input type="number" name="cantidadMinima" class="form-control form-control-sm" placeholder="Cant. m&iacute;n"></div>
<div class="col-md-2"><button class="btn btn-primary btn-sm w-100"><i class="bi bi-plus"></i> Agregar</button></div>
</div></form></div></div>
<div class="content-card"><div class="content-card-body table-responsive">
<table class="table table-sm" style="font-size:12px;"><thead><tr><th>Producto</th><th>Precio base</th><th>Precio especial</th><th>Desc %</th><th>Cant. m&iacute;n</th></tr></thead><tbody>
<tr th:each="d : ${detalles}"><td th:text="${d.producto.nombre}">-</td><td>S/ <span th:text="${d.producto.precioVenta}">0</span></td>
<td class="fw-bold" th:text="${d.precioEspecial != null ? 'S/ ' + d.precioEspecial : '-'}">-</td>
<td th:text="${d.descuentoPorcentaje != null ? d.descuentoPorcentaje + '%' : '-'}">-</td>
<td th:text="${d.cantidadMinima != null ? d.cantidadMinima : '-'}">-</td></tr>
</tbody></table></div></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
