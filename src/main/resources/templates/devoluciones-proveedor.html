<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Devoluciones Proveedor - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout">    <div th:replace="~{fragments/sidebar :: sidebar('devoluciones')}"></div>
<div class="main-wrapper"><header class="topbar"><h1 class="topbar-title">Devoluciones a Proveedores</h1></header>
<main class="main-content">
<div th:if="${ok}" class="alert alert-success"><span th:text="${ok}"></span></div>
<div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
<div class="content-card mb-3"><div class="content-card-header"><h5>Nueva devoluci&oacute;n</h5></div><div class="content-card-body">
<form method="post" th:action="@{/web/devoluciones-proveedor}"><div class="row g-2 mb-2">
<div class="col-md-3"><select name="proveedorId" class="form-select form-select-sm" required><option value="">Proveedor</option><option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.razonSocial}">-</option></select></div>
<div class="col-md-3"><select name="motivo" class="form-select form-select-sm" required><option th:each="m : ${motivos}" th:value="${m}" th:text="${m}">-</option></select></div>
<div class="col-md-6"><input type="text" name="observaciones" class="form-control form-control-sm" placeholder="Observaciones"></div>
</div>
<div id="dev-items"><div class="row g-2 mb-1 dev-row">
<div class="col-md-4"><select name="productoIds" class="form-select form-select-sm" required><option value="">Producto</option><option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}">-</option></select></div>
<div class="col-md-2"><input type="number" name="cantidades" class="form-control form-control-sm" min="1" value="1" required></div>
<div class="col-md-2"><input type="text" name="lotes" class="form-control form-control-sm" placeholder="Lote"></div>
<div class="col-md-2"><button type="button" class="btn btn-sm btn-outline-success" onclick="this.closest('form').querySelector('#dev-items').appendChild(document.querySelector('.dev-row').cloneNode(true))"><i class="bi bi-plus"></i></button></div>
</div></div>
<button type="submit" class="btn btn-primary btn-sm mt-2"><i class="bi bi-save"></i> Registrar</button>
</form></div></div>
<div class="content-card"><div class="content-card-body table-responsive">
<table class="table table-sm table-hover" style="font-size:12px;"><thead><tr><th>N&ordm;</th><th>Fecha</th><th>Proveedor</th><th>Motivo</th><th>Total</th><th>Estado</th><th>NC Prov.</th><th>Acciones</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(devoluciones)}"><td colspan="8" class="text-muted">Sin devoluciones</td></tr>
<tr th:each="d : ${devoluciones}">
<td th:text="${d.numero}">-</td><td th:text="${#temporals.format(d.fecha,'dd/MM/yyyy')}">-</td>
<td th:text="${d.proveedor.razonSocial}">-</td><td th:text="${d.motivo}">-</td>
<td>S/ <span th:text="${#numbers.formatDecimal(d.total,1,2)}">0</span></td>
<td><span class="badge" th:classappend="${d.estado == 'PENDIENTE' ? 'bg-warning' : d.estado == 'ENVIADA' ? 'bg-info' : d.estado == 'ACEPTADA' ? 'bg-success' : 'bg-danger'}" th:text="${d.estado}">-</span></td>
<td th:text="${d.notaCreditoProveedor != null ? d.notaCreditoProveedor : '-'}">-</td>
<td>
<form th:if="${d.estado == 'PENDIENTE'}" th:action="@{/web/devoluciones-proveedor/{id}/enviar(id=${d.id})}" method="post" class="d-inline"><button type="submit" class="btn btn-xs btn-outline-primary">Enviar</button></form>
<form th:if="${d.estado == 'ENVIADA'}" th:action="@{/web/devoluciones-proveedor/{id}/respuesta(id=${d.id})}" method="post" class="d-inline"><input type="text" name="notaCredito" class="form-control form-control-sm d-inline" style="width:80px" placeholder="NC"><select name="estado" class="form-select form-select-sm d-inline" style="width:auto"><option value="ACEPTADA">Aceptada</option><option value="RECHAZADA">Rechazada</option></select><button type="submit" class="btn btn-xs btn-outline-success">OK</button></form>
</td></tr></tbody></table></div></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
