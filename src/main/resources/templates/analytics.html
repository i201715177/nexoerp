<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Analytics - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script></head>
<body><div class="app-layout">    <div th:replace="~{fragments/sidebar :: sidebar('analytics')}"></div>
<div class="main-wrapper"><header class="topbar"><h1 class="topbar-title"><i class="bi bi-bar-chart-line"></i> Analytics</h1></header>
<main class="main-content">
<div class="row g-3 mb-4">
<div class="col-md-12"><div class="card p-3"><h6>Ventas mensuales (&uacute;ltimos 12 meses)</h6><canvas id="chartMensual" height="120"></canvas></div></div>
</div>
<div class="row g-3 mb-4">
<div class="col-md-6"><div class="card p-3"><h6>Margen de utilidad por categor&iacute;a</h6><canvas id="chartMargen" height="200"></canvas></div></div>
<div class="col-md-6"><div class="card p-3"><h6>An&aacute;lisis ABC (productos, 30 d&iacute;as)</h6>
<div class="table-responsive" style="max-height:300px;overflow-y:auto;">
<table class="table table-sm" style="font-size:11px;"><thead><tr><th>Producto</th><th>Venta</th><th>% Acum</th><th>Clase</th></tr></thead><tbody>
<tr th:each="r : ${analisisABC}" th:classappend="${r['clase'] == 'A' ? 'table-success' : r['clase'] == 'B' ? 'table-warning' : ''}">
<td th:text="${r['producto']}">-</td>
<td>S/ <span th:text="${#numbers.formatDecimal(r['venta'],1,2)}">0</span></td>
<td th:text="${r['porcentajeAcum'] + '%'}">-</td>
<td><span class="badge" th:classappend="${r['clase'] == 'A' ? 'bg-success' : r['clase'] == 'B' ? 'bg-warning' : 'bg-secondary'}" th:text="${r['clase']}">-</span></td>
</tr></tbody></table></div></div></div>
</div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
const mensual = /*[[${ventasMensuales}]]*/ {};
new Chart(document.getElementById('chartMensual'), {
    type: 'line', data: { labels: Object.keys(mensual), datasets: [{ label: 'Ventas S/', data: Object.values(mensual), borderColor: '#36A2EB', backgroundColor: 'rgba(54,162,235,0.15)', fill: true, tension: 0.3 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
});
const margen = /*[[${margenCategorias}]]*/ {};
const colors = ['#4BC0C0','#FF6384','#36A2EB','#FFCE56','#9966FF','#FF9F40','#C9CBCF','#7BC67E'];
new Chart(document.getElementById('chartMargen'), {
    type: 'bar', data: { labels: Object.keys(margen), datasets: [{ label: 'Margen %', data: Object.values(margen), backgroundColor: colors }] },
    options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } } }
});
</script></body></html>
