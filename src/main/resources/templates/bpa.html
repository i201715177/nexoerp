<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BPA - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout">    <div th:replace="~{fragments/sidebar :: sidebar('bpa')}"></div>
<div class="main-wrapper"><header class="topbar"><h1 class="topbar-title">Buenas Pr&aacute;cticas de Almacenamiento (BPA)</h1></header>
<main class="main-content">
<div th:if="${ok}" class="alert alert-success"><span th:text="${ok}"></span></div>
<div class="content-card mb-3"><div class="content-card-header"><h5>Nuevo checklist BPA</h5></div><div class="content-card-body">
<form method="post" th:action="@{/web/bpa}">
<div class="row g-2 mb-2">
<div class="col-md-3"><select name="almacenId" class="form-select form-select-sm"><option value="">Almac&eacute;n</option><option th:each="a : ${almacenes}" th:value="${a.id}" th:text="${a.nombre}">-</option></select></div>
<div class="col-md-3"><select name="tipo" class="form-select form-select-sm" required><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}">-</option></select></div>
<div class="col-md-3"><input type="date" name="fecha" class="form-control form-control-sm"></div>
<div class="col-md-3"><input type="date" name="proximaRevision" class="form-control form-control-sm" placeholder="Pr&oacute;x. revisi&oacute;n"></div>
</div>
<h6 class="mt-2">Condiciones del almac&eacute;n</h6>
<div class="row g-2">
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="piso" value="true" checked class="form-check-input"><label class="form-check-label small">Piso en buen estado</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="paredes" value="true" checked class="form-check-input"><label class="form-check-label small">Paredes en buen estado</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="techo" value="true" checked class="form-check-input"><label class="form-check-label small">Techo en buen estado</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="iluminacion" value="true" checked class="form-check-input"><label class="form-check-label small">Iluminaci&oacute;n adecuada</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="ventilacion" value="true" checked class="form-check-input"><label class="form-check-label small">Ventilaci&oacute;n adecuada</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="ordenados" value="true" checked class="form-check-input"><label class="form-check-label small">Productos ordenados</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="separacion" value="true" checked class="form-check-input"><label class="form-check-label small">Separaci&oacute;n de pared</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="vencidosSep" value="true" checked class="form-check-input"><label class="form-check-label small">Vencidos separados</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="extintor" value="true" checked class="form-check-input"><label class="form-check-label small">Extintor vigente</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="botiquin" value="true" checked class="form-check-input"><label class="form-check-label small">Botiqu&iacute;n primeros auxilios</label></div></div>
</div>
<div class="row g-2 mt-2">
<div class="col-md-6"><textarea name="observaciones" class="form-control form-control-sm" rows="2" placeholder="Observaciones"></textarea></div>
<div class="col-md-6"><textarea name="accionCorrectiva" class="form-control form-control-sm" rows="2" placeholder="Acci&oacute;n correctiva (si aplica)"></textarea></div>
</div>
<button type="submit" class="btn btn-primary btn-sm mt-2"><i class="bi bi-save"></i> Registrar checklist</button>
</form></div></div>
<div class="content-card"><div class="content-card-body table-responsive">
<table class="table table-sm" style="font-size:11px;"><thead><tr><th>C&oacute;digo</th><th>Fecha</th><th>Tipo</th><th>Almac&eacute;n</th><th>Resultado</th><th>Pr&oacute;x. revisi&oacute;n</th><th>Usuario</th><th></th></tr></thead><tbody>
<tr th:each="c : ${checklists}" th:classappend="${c.resultadoGeneral == 'NO_CONFORME' ? 'table-warning' : ''}">
<td th:text="${c.codigo}">-</td><td th:text="${c.fecha}">-</td><td th:text="${c.tipo}">-</td>
<td th:text="${c.almacen != null ? c.almacen.nombre : '-'}">-</td>
<td><span class="badge" th:classappend="${c.resultadoGeneral == 'CONFORME' ? 'bg-success' : 'bg-danger'}" th:text="${c.resultadoGeneral}">-</span></td>
<td th:text="${c.fechaProximaRevision}">-</td><td th:text="${c.usuarioRegistro}">-</td>
<td><a th:href="@{/web/bpa/{id}(id=${c.id})}" class="btn btn-xs btn-outline-primary"><i class="bi bi-eye"></i></a></td>
</tr></tbody></table></div></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
