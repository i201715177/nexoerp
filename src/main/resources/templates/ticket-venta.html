<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Ticket</title>
<style>
*{margin:0;padding:0;font-family:'Courier New',monospace;font-size:12px;}
body{width:80mm;margin:0 auto;padding:5mm;}
.center{text-align:center;}.right{text-align:right;}.bold{font-weight:bold;}
.divider{border-top:1px dashed #000;margin:3mm 0;}
table{width:100%;border-collapse:collapse;}
td{padding:1px 0;vertical-align:top;}
@media print{body{width:auto;margin:0;padding:2mm;}@page{margin:0;size:80mm auto;}}
.no-print{text-align:center;padding:10px;} @media print{.no-print{display:none;}}
</style></head>
<body>
<div class="no-print"><button onclick="window.print()">Imprimir ticket</button> <a href="/web/ventas">Volver</a></div>
<div class="center bold" style="font-size:14px;" th:text="${empresaActual != null ? empresaActual.nombre : 'DROGUERIA'}">EMPRESA</div>
<div class="center" th:if="${empresaActual != null and empresaActual.ruc != null}" th:text="'RUC: ' + ${empresaActual.ruc}"></div>
<div class="center" th:if="${empresaActual != null and empresaActual.direccion != null}" th:text="${empresaActual.direccion}"></div>
<div class="divider"></div>
<div class="bold" th:text="${(venta.tipoComprobante != null ? venta.tipoComprobante : 'NOTA DE VENTA') + ' ' + (venta.serieComprobante != null ? venta.serieComprobante + '-' : '') + (venta.numeroComprobante != null ? venta.numeroComprobante : '')}">COMPROBANTE</div>
<div th:text="'Fecha: ' + ${#temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm')}">-</div>
<div th:text="'Cliente: ' + ${venta.nombreClienteVenta != null ? venta.nombreClienteVenta : 'VARIOS'}">-</div>
<div class="divider"></div>
<table>
<tr class="bold"><td>Producto</td><td class="right">Cant</td><td class="right">P.U.</td><td class="right">Sub.</td></tr>
<tr th:each="item : ${venta.items}">
<td th:text="${item.producto.nombre}" style="max-width:40mm;overflow:hidden;">-</td>
<td class="right" th:text="${item.cantidad}">0</td>
<td class="right" th:text="${#numbers.formatDecimal(item.precioUnitario,1,2)}">0</td>
<td class="right" th:text="${#numbers.formatDecimal(item.subtotal,1,2)}">0</td>
</tr></table>
<div class="divider"></div>
<table>
<tr><td>Subtotal:</td><td class="right">S/ <span th:text="${#numbers.formatDecimal(venta.subtotal,1,2)}">0</span></td></tr>
<tr th:if="${venta.descuentoTotal != null and venta.descuentoTotal.compareTo(T(java.math.BigDecimal).ZERO) > 0}"><td>Descuento:</td><td class="right">-S/ <span th:text="${#numbers.formatDecimal(venta.descuentoTotal,1,2)}">0</span></td></tr>
<tr class="bold" style="font-size:14px;"><td>TOTAL:</td><td class="right">S/ <span th:text="${#numbers.formatDecimal(venta.total,1,2)}">0</span></td></tr>
</table>
<div class="divider"></div>
<div th:if="${venta.pagos != null}" th:each="p : ${venta.pagos}" th:text="'Pago: ' + ${p.medioPago} + ' S/ ' + ${#numbers.formatDecimal(p.monto,1,2)}"></div>
<div class="divider"></div>
<div class="center" style="font-size:10px;">Gracias por su compra</div>
<div class="center" style="font-size:9px;">NexoERP - Sistema de gesti&oacute;n</div>
</body></html>
