<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloReporte != null ? tituloReporte : 'Historial distribuci\u00f3n'}">Distribuci&oacute;n</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('digemid')}"></div>
    <div class="main-wrapper">
        <header class="topbar">
            <h1 class="topbar-title" th:text="${tituloReporte != null ? tituloReporte : 'Historial distribuci\u00f3n'}">Distribuci&oacute;n</h1>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/digemid}">Volver</a>
        </header>
        <main class="main-content">
            <form method="get" class="row g-2 align-items-end mb-3">
                <div class="col-auto"><label class="form-label">Desde</label><input type="date" name="desde" class="form-control form-control-sm" th:value="${#temporals.format(desde, 'yyyy-MM-dd')}"></div>
                <div class="col-auto"><label class="form-label">Hasta</label><input type="date" name="hasta" class="form-control form-control-sm" th:value="${#temporals.format(hasta, 'yyyy-MM-dd')}"></div>
                <div class="col-auto"><button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-funnel me-1"></i> Filtrar</button></div>
            </form>
            <p class="text-muted">Mostrando desde <strong th:text="${#temporals.format(desde)}">-</strong> hasta <strong th:text="${#temporals.format(hasta)}">-</strong></p>
            <div class="content-card">
                <div class="content-card-body table-responsive">
                    <table class="table table-sm table-hover">
                        <thead><tr><th>Fecha</th><th>Producto</th><th>Lote</th><th>Origen</th><th>Destino</th><th>Cant.</th><th>Estado</th><th>RUC cliente</th><th>Raz&oacute;n social</th><th>Tipo estab.</th><th>Factura</th><th>Gu&iacute;a rem.</th></tr></thead>
                        <tbody>
                        <tr th:if="${distribuciones == null or #lists.isEmpty(distribuciones)}"><td colspan="12" class="text-muted">Sin distribuciones.</td></tr>
                        <tr th:each="d : ${distribuciones}">
                            <td th:text="${d.fechaEnvio != null ? #temporals.format(d.fechaEnvio) : '-'}">-</td>
                            <td th:text="${d.producto != null ? d.producto.nombre : '-'}">-</td>
                            <td th:text="${d.lote != null ? d.lote : '-'}">-</td>
                            <td th:text="${d.almacenOrigen != null ? d.almacenOrigen.nombre : '-'}">-</td>
                            <td th:text="${d.almacenDestino != null ? d.almacenDestino.nombre : '-'}">-</td>
                            <td th:text="${d.cantidad}">0</td>
                            <td><span class="badge" th:classappend="${d.estado == 'RECIBIDO'} ? 'bg-success' : 'bg-warning'" th:text="${d.estado}">-</span></td>
                            <td th:text="${d.clienteRuc != null ? d.clienteRuc : '-'}">-</td>
                            <td th:text="${d.clienteRazonSocial != null ? d.clienteRazonSocial : '-'}">-</td>
                            <td th:text="${d.tipoEstablecimiento != null ? d.tipoEstablecimiento : '-'}">-</td>
                            <td th:text="${d.numeroFactura != null ? d.numeroFactura : '-'}">-</td>
                            <td th:text="${d.numeroGuiaRemision != null ? d.numeroGuiaRemision : '-'}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
