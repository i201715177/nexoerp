<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cotizaci&oacute;n - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/app.css}">
<style>@media print{.no-print{display:none!important;}}</style></head>
<body>
<div class="no-print p-2 bg-light border-bottom d-flex justify-content-between">
<a href="/web/cotizaciones" class="btn btn-sm btn-outline-secondary">Volver</a>
<button onclick="window.print()" class="btn btn-sm btn-primary"><i class="bi bi-printer"></i> Imprimir</button>
</div>
<div style="max-width:800px;margin:20px auto;padding:20px;">
<h4>Cotizaci&oacute;n <span th:text="${cotizacion.numero}">-</span></h4>
<div class="row mb-3">
<div class="col-6"><strong>Fecha:</strong> <span th:text="${#temporals.format(cotizacion.fecha,'dd/MM/yyyy')}">-</span><br><strong>Vigencia:</strong> <span th:text="${cotizacion.vigenciaHasta}">-</span><br><strong>Estado:</strong> <span th:text="${cotizacion.estado}">-</span></div>
<div class="col-6 text-end"><strong>Cliente:</strong> <span th:text="${cotizacion.nombreCliente}">-</span></div>
</div>
<table class="table table-bordered table-sm"><thead><tr><th>Producto</th><th>Cant.</th><th>P. Unit.</th><th>Desc.</th><th>Subtotal</th></tr></thead><tbody>
<tr th:each="item : ${cotizacion.items}"><td th:text="${item.producto.nombre}">-</td><td th:text="${item.cantidad}">0</td><td>S/ <span th:text="${#numbers.formatDecimal(item.precioUnitario,1,2)}">0</span></td><td>S/ <span th:text="${#numbers.formatDecimal(item.descuento,1,2)}">0</span></td><td>S/ <span th:text="${#numbers.formatDecimal(item.subtotal,1,2)}">0</span></td></tr>
</tbody></table>
<div class="text-end"><strong>Subtotal:</strong> S/ <span th:text="${#numbers.formatDecimal(cotizacion.subtotal,1,2)}">0</span><br><strong>Descuento:</strong> S/ <span th:text="${#numbers.formatDecimal(cotizacion.descuentoTotal,1,2)}">0</span><br><strong class="fs-5">Total: S/ <span th:text="${#numbers.formatDecimal(cotizacion.total,1,2)}">0</span></strong></div>
<p th:if="${cotizacion.observaciones != null}" class="mt-3 text-muted" th:text="${cotizacion.observaciones}">-</p>
</div></body></html>
