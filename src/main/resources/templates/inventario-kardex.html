<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kardex - NexoERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('inventario')}"></div>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- Main -->
    <div class="main-wrapper">
        <header class="topbar">
            <button class="btn-sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <h1 class="topbar-title">Kardex</h1>
            <div class="topbar-actions">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/productos}"><i class="bi bi-arrow-left me-1"></i> Volver a productos</a>
            </div>
            <div class="topbar-user" th:if="${usuarioActual != null}">
                <div class="topbar-user-avatar" th:text="${#strings.toUpperCase(#strings.substring(usuarioActual,0,1))}">A</div>
                <div>
                    <span class="topbar-user-name" th:text="${usuarioActual}">admin</span>
                    <div class="topbar-user-empresa" th:text="${empresaActual != null ? empresaActual.nombre : ''}"></div>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout-top"><i class="bi bi-box-arrow-left"></i> Salir</button>
                </form>
            </div>
        </header>

        <main class="main-content">
            <!-- KPIs -->
            <div class="kpi-row">
                <div class="kpi-card">
                    <div class="kpi-icon blue"><i class="bi bi-box-seam"></i></div>
                    <div class="kpi-body">
                        <div class="kpi-label">Producto</div>
                        <div class="kpi-value" th:text="${producto.nombre}">-</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon green"><i class="bi bi-boxes"></i></div>
                    <div class="kpi-body">
                        <div class="kpi-label">Stock actual</div>
                        <div class="kpi-value" th:text="${producto.stockActual}">0</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon yellow"><i class="bi bi-journal-text"></i></div>
                    <div class="kpi-body">
                        <div class="kpi-label">Movimientos</div>
                        <div class="kpi-value" th:text="${movimientos != null ? #lists.size(movimientos) : 0}">0</div>
                    </div>
                </div>
            </div>

            <!-- Tabla movimientos -->
            <div class="content-card">
                <div class="content-card-header">
                    <h3><i class="bi bi-table me-2"></i>Movimientos del producto</h3>
                </div>
                <div class="content-card-body no-padding">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th class="text-end">Cantidad</th>
                            <th class="text-end">Saldo despu&eacute;s</th>
                            <th>Referencia</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="m : ${movimientos}">
                            <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}">-</td>
                            <td><span class="badge-status" th:classappend="${m.cantidad != null and m.cantidad < 0 ? 'danger' : 'success'}" th:text="${m.tipo}">-</span></td>
                            <td class="text-end" th:classappend="${m.cantidad != null and m.cantidad < 0} ? 'text-danger' : 'text-success'"
                                th:text="${m.cantidad}">0</td>
                            <td class="text-end fw-700" th:text="${m.saldoDespues}">-</td>
                            <td th:text="${m.referencia}">-</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(movimientos)}">
                            <td colspan="5">
                                <div class="empty-state">
                                    <i class="bi bi-inbox"></i>
                                    <p>No hay movimientos registrados.</p>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
