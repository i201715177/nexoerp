<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inventario F&iacute;sico - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout">    <div th:replace="~{fragments/sidebar :: sidebar('inventario-fisico')}"></div>
<div class="main-wrapper"><header class="topbar"><h1 class="topbar-title">Toma de Inventario F&iacute;sico</h1></header>
<main class="main-content">
<div th:if="${ok}" class="alert alert-success"><span th:text="${ok}"></span></div>
<div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
<div class="content-card mb-3"><div class="content-card-header"><h5>Crear nuevo inventario f&iacute;sico</h5></div><div class="content-card-body">
<form method="post" th:action="@{/web/inventario-fisico}"><div class="row g-2">
<div class="col-md-4"><select name="almacenId" class="form-select form-select-sm"><option value="">Todos los almacenes</option><option th:each="a : ${almacenes}" th:value="${a.id}" th:text="${a.nombre}">-</option></select></div>
<div class="col-md-5"><input type="text" name="observaciones" class="form-control form-control-sm" placeholder="Observaciones"></div>
<div class="col-md-3"><button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-plus"></i> Crear inventario</button></div>
</div></form></div></div>
<div class="content-card"><div class="content-card-body table-responsive">
<table class="table table-sm table-hover" style="font-size:12px;"><thead><tr><th>C&oacute;digo</th><th>Fecha</th><th>Almac&eacute;n</th><th>Estado</th><th>Usuario</th><th>Cierre</th><th>Acciones</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(inventarios)}"><td colspan="7" class="text-muted">Sin inventarios f&iacute;sicos</td></tr>
<tr th:each="i : ${inventarios}">
<td><strong th:text="${i.codigo}">-</strong></td>
<td th:text="${#temporals.format(i.fecha,'dd/MM/yyyy HH:mm')}">-</td>
<td th:text="${i.almacen != null ? i.almacen.nombre : 'Global'}">-</td>
<td><span class="badge" th:classappend="${i.estado == 'ABIERTO' ? 'bg-primary' : i.estado == 'CERRADO' ? 'bg-warning' : i.estado == 'AJUSTADO' ? 'bg-success' : 'bg-secondary'}" th:text="${i.estado}">-</span></td>
<td th:text="${i.usuarioRegistro}">-</td>
<td th:text="${i.fechaCierre != null ? #temporals.format(i.fechaCierre,'dd/MM/yyyy') : '-'}">-</td>
<td><a th:href="@{/web/inventario-fisico/{id}(id=${i.id})}" class="btn btn-xs btn-outline-primary"><i class="bi bi-eye"></i> Ver/Contar</a></td>
</tr></tbody></table></div></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
