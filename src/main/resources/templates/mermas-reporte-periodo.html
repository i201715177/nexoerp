<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reporte mermas por periodo - NexoERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('mermas')}"></div>
    <div class="main-wrapper">
        <header class="topbar">
            <h1 class="topbar-title">Reporte de mermas por periodo</h1>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/mermas}">Volver</a>
        </header>
        <main class="main-content">
            <form method="get" class="row g-2 align-items-end mb-3">
                <div class="col-auto"><label class="form-label">Desde</label><input type="date" name="desde" class="form-control form-control-sm" th:value="${#temporals.format(desde, 'yyyy-MM-dd')}"></div>
                <div class="col-auto"><label class="form-label">Hasta</label><input type="date" name="hasta" class="form-control form-control-sm" th:value="${#temporals.format(hasta, 'yyyy-MM-dd')}"></div>
                <div class="col-auto"><button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-funnel me-1"></i> Filtrar</button></div>
            </form>
            <div class="content-card">
                <div class="content-card-body table-responsive">
                    <table class="table table-sm table-hover">
                        <thead><tr><th>N&ordm; Merma</th><th>Fecha</th><th>Producto</th><th>Lote</th><th>Cantidad</th><th>Motivo</th><th>Tipo</th><th>Stock antes</th><th>Stock despu&eacute;s</th><th>Costo est.</th><th>Usuario</th></tr></thead>
                        <tbody>
                        <tr th:if="${mermas == null or #lists.isEmpty(mermas)}"><td colspan="11" class="text-muted">Sin mermas en el periodo.</td></tr>
                        <tr th:each="m : ${mermas}">
                            <td th:text="${m.numeroMerma != null ? m.numeroMerma : '-'}">-</td>
                            <td th:text="${m.fechaRegistro != null ? #temporals.format(m.fechaRegistro) : '-'}">-</td>
                            <td th:text="${m.producto != null ? m.producto.nombre : '-'}">-</td>
                            <td th:text="${m.lote != null ? m.lote : '-'}">-</td>
                            <td th:text="${m.cantidad}">0</td>
                            <td th:text="${m.motivo != null ? m.motivo : '-'}">-</td>
                            <td><span class="badge bg-secondary" th:text="${m.tipoMerma}">-</span></td>
                            <td th:text="${m.stockAntes != null ? m.stockAntes : '-'}">-</td>
                            <td th:text="${m.stockDespues != null ? m.stockDespues : '-'}">-</td>
                            <td th:text="${m.costoEstimado != null ? m.costoEstimado : '-'}">-</td>
                            <td th:text="${m.usuarioRegistro != null ? m.usuarioRegistro : '-'}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
