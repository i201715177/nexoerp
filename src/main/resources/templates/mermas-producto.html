<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mermas por producto - NexoERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('mermas')}"></div>
    <div class="main-wrapper">
        <header class="topbar">
            <h1 class="topbar-title">Mermas - <span th:text="${producto != null ? producto.nombre : 'Producto'}">-</span></h1>
            <div class="topbar-actions">
                <span th:if="${producto != null}" class="text-muted me-3" th:text="'C&oacute;digo: ' + ${producto.codigo} + ' | Stock actual: ' + ${producto.stockActual}">-</span>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/mermas}">Volver</a>
            </div>
        </header>
        <main class="main-content">
            <div class="content-card">
                <div class="content-card-body table-responsive">
                    <table class="table table-sm table-hover" style="font-size:12px;">
                        <thead><tr><th>N&ordm; Merma</th><th>Fecha</th><th>Lote</th><th>Almac&eacute;n</th><th>Cantidad</th><th>Stock antes</th><th>Stock despu&eacute;s</th><th>Tipo</th><th>Motivo</th><th>Observaciones</th><th>Costo est.</th><th>Usuario</th><th>Controlado</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(mermas)}"><td colspan="13" class="text-muted">Sin mermas para este producto.</td></tr>
                        <tr th:each="m : ${mermas}">
                            <td><strong th:text="${m.numeroMerma != null ? m.numeroMerma : '-'}">-</strong></td>
                            <td th:text="${m.fechaRegistro != null ? #temporals.format(m.fechaRegistro) : '-'}">-</td>
                            <td th:text="${m.lote != null ? m.lote : '-'}">-</td>
                            <td th:text="${m.almacen != null ? m.almacen.nombre : '-'}">-</td>
                            <td th:text="${m.cantidad}">0</td>
                            <td th:text="${m.stockAntes != null ? m.stockAntes : '-'}">-</td>
                            <td th:text="${m.stockDespues != null ? m.stockDespues : '-'}">-</td>
                            <td><span class="badge bg-secondary" th:text="${m.tipoMerma}">-</span></td>
                            <td th:text="${m.motivo != null ? m.motivo : '-'}">-</td>
                            <td th:text="${m.observaciones != null ? m.observaciones : '-'}">-</td>
                            <td th:text="${m.costoEstimado != null ? m.costoEstimado : '-'}">-</td>
                            <td th:text="${m.usuarioRegistro != null ? m.usuarioRegistro : '-'}">-</td>
                            <td>
                                <span th:if="${m.esControlado}" class="badge bg-info">S&iacute;</span>
                                <span th:unless="${m.esControlado}" class="text-muted">No</span>
                                <small th:if="${m.actaDestruccion != null}" class="d-block text-danger" th:text="'Acta: ' + ${m.actaDestruccion}"></small>
                                <small th:if="${m.responsableAutorizado != null}" class="d-block" th:text="'Resp: ' + ${m.responsableAutorizado}"></small>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
