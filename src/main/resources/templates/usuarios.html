<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuarios - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout">    <div th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></div>
<div class="main-wrapper"><header class="topbar"><button class="btn-sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list"></i></button><h1 class="topbar-title">Gesti&oacute;n de Usuarios</h1></header>
<main class="main-content">
<div th:if="${ok}" class="alert alert-success alert-dismissible fade show"><span th:text="${ok}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
<div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
<div class="content-card mb-3"><div class="content-card-header"><h5>Nuevo usuario</h5></div><div class="content-card-body">
<form method="post" th:action="@{/web/usuarios}"><div class="row g-2">
<div class="col-md-2"><input type="text" name="username" class="form-control form-control-sm" placeholder="Usuario" required></div>
<div class="col-md-2"><input type="password" name="password" class="form-control form-control-sm" placeholder="Contrase&ntilde;a" required></div>
<div class="col-md-3"><input type="text" name="nombreCompleto" class="form-control form-control-sm" placeholder="Nombre completo"></div>
<div class="col-md-2"><select name="rol" class="form-select form-select-sm" required><option th:each="r : ${roles}" th:value="${r}" th:text="${r}">-</option></select></div>
<div class="col-md-2"><select name="sucursalId" class="form-select form-select-sm"><option value="">Sin sucursal</option><option th:each="s : ${sucursales}" th:value="${s.id}" th:text="${s.nombre}">-</option></select></div>
<div class="col-md-1"><button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-plus"></i></button></div>
</div></form></div></div>
<div class="content-card"><div class="content-card-body table-responsive">
<table class="table table-sm table-hover" style="font-size:12px;"><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Sucursal</th><th>Activo</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="u : ${usuarios}">
<td th:text="${u.username}">-</td><td th:text="${u.nombreCompleto}">-</td><td><span class="badge bg-info" th:text="${u.rol}">-</span></td>
<td th:text="${u.sucursalId != null ? u.sucursalId : '-'}">-</td>
<td><span th:if="${u.activo}" class="badge bg-success">S&iacute;</span><span th:unless="${u.activo}" class="badge bg-danger">No</span></td>
<td>
<form th:action="@{/web/usuarios/{id}/estado(id=${u.id})}" method="post" class="d-inline"><input type="hidden" name="activo" th:value="${!u.activo}"><button type="submit" class="btn btn-xs btn-outline-warning" th:text="${u.activo ? 'Desactivar' : 'Activar'}">-</button></form>
<button class="btn btn-xs btn-outline-secondary" data-bs-toggle="modal" th:data-bs-target="'#resetModal' + ${u.id}">Reset pwd</button>
<form th:action="@{/web/usuarios/eliminar/{id}(id=${u.id})}" method="post" class="d-inline" onsubmit="return confirm('Eliminar usuario?')"><button type="submit" class="btn btn-xs btn-outline-danger"><i class="bi bi-trash"></i></button></form>
</td></tr></tbody></table></div></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
