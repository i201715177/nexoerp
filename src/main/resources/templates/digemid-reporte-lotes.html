<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloReporte != null ? tituloReporte : 'Control de lotes'}" >Control lotes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('digemid')}"></div>
    <div class="main-wrapper">
        <header class="topbar">
            <h1 class="topbar-title" th:text="${tituloReporte != null ? tituloReporte : 'Control de lotes'}">Control lotes</h1>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/digemid}">Volver</a>
        </header>
        <main class="main-content">
            <div class="content-card">
                <div class="content-card-body table-responsive">
                    <table class="table table-sm table-hover">
                        <thead><tr><th>Producto</th><th>Lote</th><th>Almac&eacute;n</th><th>Ubicaci&oacute;n</th><th>Vencimiento</th><th>Cantidad</th><th>Stock m&iacute;n.</th><th>Estado</th></tr></thead>
                        <tbody>
                        <tr th:if="${stockControlado == null or #lists.isEmpty(stockControlado)}"><td colspan="8" class="text-muted">Sin registros.</td></tr>
                        <tr th:each="s : ${stockControlado}">
                            <td th:text="${s.producto != null ? s.producto.nombre : '-'}">-</td>
                            <td th:text="${s.lote != null ? s.lote : '-'}">-</td>
                            <td th:text="${s.almacen != null ? s.almacen.nombre : 'Global'}">-</td>
                            <td th:text="${s.ubicacionAlmacen != null ? s.ubicacionAlmacen : '-'}">-</td>
                            <td th:text="${s.fechaVencimiento != null ? #temporals.format(s.fechaVencimiento) : '-'}">-</td>
                            <td th:text="${s.cantidad}">0</td>
                            <td th:text="${s.stockMinimo != null ? s.stockMinimo : '-'}">-</td>
                            <td>
                                <span th:if="${s.fechaVencimiento != null and s.fechaVencimiento.isBefore(T(java.time.LocalDate).now())}" class="badge bg-danger">Vencido</span>
                                <span th:if="${s.stockMinimo != null and s.cantidad != null and s.cantidad lt s.stockMinimo}" class="badge bg-warning text-dark">Stock bajo</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
