<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kardex controlado - NexoERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('digemid')}"></div>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    <div class="main-wrapper">
        <header class="topbar">
            <button class="btn-sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <h1 class="topbar-title">Kardex controlado<span th:if="${producto != null}" th:text="' - ' + ${producto.nombre}">-</span></h1>
            <div class="topbar-actions">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/digemid}"><i class="bi bi-arrow-left me-1"></i> Volver DIGEMID</a>
            </div>
        </header>
        <main class="main-content">
            <div class="content-card">
                <div class="content-card-body table-responsive">
                    <table class="table table-sm table-hover">
                        <thead><tr><th>Fecha</th><th>Tipo movimiento</th><th>Documento</th><th>Entrada</th><th>Salida</th><th>Saldo</th><th>Lote</th><th>Usuario</th><th>Motivo</th><th>Referencia</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(kardex)}"><td colspan="10" class="text-muted">Sin movimientos.</td></tr>
                        <tr th:each="k : ${kardex}">
                            <td th:text="${k.fecha != null ? #temporals.format(k.fecha) : '-'}">-</td>
                            <td><span class="badge" th:classappend="${k.cantidad != null and k.cantidad > 0} ? 'bg-success' : 'bg-danger'" th:text="${k.tipo}">-</span></td>
                            <td th:text="${k.numeroDocumento != null ? k.numeroDocumento : '-'}">-</td>
                            <td th:text="${k.cantidad != null and k.cantidad > 0 ? k.cantidad : ''}"></td>
                            <td th:text="${k.cantidad != null and k.cantidad < 0 ? T(java.lang.Math).abs(k.cantidad) : ''}"></td>
                            <td th:text="${k.saldoDespues != null ? k.saldoDespues : '-'}">-</td>
                            <td th:text="${k.lote != null ? k.lote : '-'}">-</td>
                            <td th:text="${k.usuarioRegistro != null ? k.usuarioRegistro : '-'}">-</td>
                            <td th:text="${k.motivo != null ? k.motivo : '-'}">-</td>
                            <td th:text="${k.referencia != null ? k.referencia : '-'}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
