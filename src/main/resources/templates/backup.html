<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Backup - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout">    <div th:replace="~{fragments/sidebar :: sidebar('backup')}"></div>
<div class="main-wrapper"><header class="topbar"><h1 class="topbar-title"><i class="bi bi-download"></i> Backup / Exportaci&oacute;n de datos</h1></header>
<main class="main-content">
<div class="row g-3">
<div class="col-md-4"><div class="card text-center p-4"><i class="bi bi-box-seam fs-1 text-primary"></i><h5 class="mt-2">Productos</h5><p class="text-muted"><span th:text="${totalProductos}">0</span> registros</p><a th:href="@{/web/backup/exportar/productos}" class="btn btn-primary"><i class="bi bi-download"></i> Exportar CSV</a></div></div>
<div class="col-md-4"><div class="card text-center p-4"><i class="bi bi-people fs-1 text-success"></i><h5 class="mt-2">Clientes</h5><p class="text-muted"><span th:text="${totalClientes}">0</span> registros</p><a th:href="@{/web/backup/exportar/clientes}" class="btn btn-success"><i class="bi bi-download"></i> Exportar CSV</a></div></div>
<div class="col-md-4"><div class="card text-center p-4"><i class="bi bi-receipt fs-1 text-info"></i><h5 class="mt-2">Ventas</h5><p class="text-muted"><span th:text="${totalVentas}">0</span> registros</p><a th:href="@{/web/backup/exportar/ventas}" class="btn btn-info"><i class="bi bi-download"></i> Exportar CSV</a></div></div>
</div>
<div class="alert alert-info mt-3"><i class="bi bi-info-circle"></i> Los archivos se exportan en formato CSV compatible con Excel. Se recomienda realizar backups peri&oacute;dicamente.</div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
