<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Libro de Reclamaciones - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-layout">    <div th:replace="~{fragments/sidebar :: sidebar('reclamaciones')}"></div>
<div class="main-wrapper"><header class="topbar"><h1 class="topbar-title">Libro de Reclamaciones</h1><span class="badge bg-warning ms-2" th:text="${pendientes + ' pendientes'}">0</span></header>
<main class="main-content">
<div th:if="${ok}" class="alert alert-success"><span th:text="${ok}"></span></div>
<div class="content-card mb-3"><div class="content-card-header"><h5>Registrar queja/reclamo</h5></div><div class="content-card-body">
<form method="post" th:action="@{/web/libro-reclamaciones}"><div class="row g-2">
<div class="col-md-2"><select name="tipo" class="form-select form-select-sm" required><option value="QUEJA">Queja</option><option value="RECLAMO">Reclamo</option></select></div>
<div class="col-md-3"><input type="text" name="clienteNombre" class="form-control form-control-sm" placeholder="Nombre del cliente" required></div>
<div class="col-md-2"><input type="text" name="clienteDocumento" class="form-control form-control-sm" placeholder="DNI/RUC"></div>
<div class="col-md-2"><input type="text" name="clienteTelefono" class="form-control form-control-sm" placeholder="Tel&eacute;fono"></div>
<div class="col-md-3"><input type="email" name="clienteEmail" class="form-control form-control-sm" placeholder="Email"></div>
<div class="col-md-4"><input type="text" name="clienteDireccion" class="form-control form-control-sm" placeholder="Direcci&oacute;n"></div>
<div class="col-md-4"><input type="text" name="productoServicio" class="form-control form-control-sm" placeholder="Producto/servicio afectado"></div>
<div class="col-md-2"><input type="text" name="montoReclamado" class="form-control form-control-sm" placeholder="Monto"></div>
<div class="col-md-12"><textarea name="detalle" class="form-control form-control-sm" rows="2" placeholder="Detalle de la queja o reclamo" required></textarea></div>
</div><button type="submit" class="btn btn-primary btn-sm mt-2"><i class="bi bi-save"></i> Registrar</button>
</form></div></div>
<div class="content-card"><div class="content-card-body table-responsive">
<table class="table table-sm table-hover" style="font-size:11px;"><thead><tr><th>N&ordm;</th><th>Fecha</th><th>Tipo</th><th>Cliente</th><th>Doc</th><th>Detalle</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(reclamaciones)}"><td colspan="8" class="text-muted">Sin reclamaciones</td></tr>
<tr th:each="r : ${reclamaciones}">
<td><strong th:text="${r.numero}">-</strong></td>
<td th:text="${#temporals.format(r.fecha,'dd/MM/yyyy')}">-</td>
<td><span class="badge" th:classappend="${r.tipo == 'RECLAMO' ? 'bg-danger' : 'bg-warning'}" th:text="${r.tipo}">-</span></td>
<td th:text="${r.clienteNombre}">-</td><td th:text="${r.clienteDocumento}">-</td>
<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${r.detalle}">-</td>
<td><span class="badge" th:classappend="${r.estado == 'RECIBIDO' ? 'bg-primary' : r.estado == 'EN_PROCESO' ? 'bg-warning' : r.estado == 'RESUELTO' ? 'bg-success' : 'bg-secondary'}" th:text="${r.estado}">-</span></td>
<td><form th:if="${r.estado != 'CERRADO'}" th:action="@{/web/libro-reclamaciones/{id}/responder(id=${r.id})}" method="post" class="d-flex gap-1">
<input type="text" name="respuesta" class="form-control form-control-sm" placeholder="Respuesta" style="width:120px">
<select name="estado" class="form-select form-select-sm" style="width:auto"><option value="EN_PROCESO">En proceso</option><option value="RESUELTO">Resuelto</option><option value="CERRADO">Cerrado</option></select>
<button class="btn btn-xs btn-outline-success">OK</button></form></td>
</tr></tbody></table></div></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
