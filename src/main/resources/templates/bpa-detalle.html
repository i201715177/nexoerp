<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BPA Detalle - NexoERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/app.css}">
<style>@media print{.no-print{display:none!important;}}</style></head>
<body>
<div class="no-print p-2 bg-light border-bottom d-flex justify-content-between"><a href="/web/bpa" class="btn btn-sm btn-outline-secondary">Volver</a><button onclick="window.print()" class="btn btn-sm btn-primary"><i class="bi bi-printer"></i> Imprimir</button></div>
<div style="max-width:700px;margin:20px auto;padding:20px;">
<h4>Checklist BPA - <span th:text="${checklist.codigo}">-</span></h4>
<p><strong>Fecha:</strong> <span th:text="${checklist.fecha}">-</span> | <strong>Tipo:</strong> <span th:text="${checklist.tipo}">-</span> | <strong>Almac&eacute;n:</strong> <span th:text="${checklist.almacen != null ? checklist.almacen.nombre : 'N/A'}">-</span></p>
<table class="table table-bordered table-sm"><tbody>
<tr><td>Piso</td><td><span th:text="${checklist.condicionPiso ? 'OK' : 'NO OK'}">-</span></td></tr>
<tr><td>Paredes</td><td><span th:text="${checklist.condicionParedes ? 'OK' : 'NO OK'}">-</span></td></tr>
<tr><td>Techo</td><td><span th:text="${checklist.condicionTecho ? 'OK' : 'NO OK'}">-</span></td></tr>
<tr><td>Iluminaci&oacute;n</td><td><span th:text="${checklist.iluminacionAdecuada ? 'OK' : 'NO OK'}">-</span></td></tr>
<tr><td>Ventilaci&oacute;n</td><td><span th:text="${checklist.ventilacionAdecuada ? 'OK' : 'NO OK'}">-</span></td></tr>
<tr><td>Productos ordenados</td><td><span th:text="${checklist.productosOrdenados ? 'OK' : 'NO OK'}">-</span></td></tr>
<tr><td>Separaci&oacute;n de pared</td><td><span th:text="${checklist.separacionPared ? 'OK' : 'NO OK'}">-</span></td></tr>
<tr><td>Vencidos separados</td><td><span th:text="${checklist.productosVencidosSeparados ? 'OK' : 'NO OK'}">-</span></td></tr>
<tr><td>Extintor vigente</td><td><span th:text="${checklist.extintorVigente ? 'OK' : 'NO OK'}">-</span></td></tr>
<tr><td>Botiqu&iacute;n</td><td><span th:text="${checklist.botiquinPrimerosAuxilios ? 'OK' : 'NO OK'}">-</span></td></tr>
</tbody></table>
<p><strong>Resultado:</strong> <span class="badge" th:classappend="${checklist.resultadoGeneral == 'CONFORME' ? 'bg-success' : 'bg-danger'}" th:text="${checklist.resultadoGeneral}">-</span></p>
<p th:if="${checklist.observaciones != null}"><strong>Observaciones:</strong> <span th:text="${checklist.observaciones}">-</span></p>
<p th:if="${checklist.accionCorrectiva != null}"><strong>Acci&oacute;n correctiva:</strong> <span th:text="${checklist.accionCorrectiva}">-</span></p>
<p><strong>Pr&oacute;xima revisi&oacute;n:</strong> <span th:text="${checklist.fechaProximaRevision}">-</span></p>
<div class="d-flex justify-content-between mt-5"><div style="border-top:1px solid #333;width:180px;text-align:center;padding-top:5px;font-size:11px;">Responsable</div><div style="border-top:1px solid #333;width:180px;text-align:center;padding-top:5px;font-size:11px;">Q.F.</div></div>
</div></body></html>
