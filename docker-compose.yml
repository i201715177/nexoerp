version: '3.8'

services:
  app:
    build: .
    container_name: nexoerp
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/nexoerp
      - SPRING_DATASOURCE_USERNAME=nexoerp
      - SPRING_DATASOURCE_PASSWORD=nexoerp_secret
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - APP_SECURITY_JWT_SECRET=clave-super-secreta-produccion-cambiar-esto
      - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - app-logs:/app/logs
      - app-backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: nexoerp-db
    environment:
      - POSTGRES_DB=nexoerp
      - POSTGRES_USER=nexoerp
      - POSTGRES_PASSWORD=nexoerp_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoerp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  app-logs:
  app-backups:
